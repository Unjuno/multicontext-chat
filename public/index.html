<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MultiContext Chat</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div class="brand">
      <strong>MultiContext</strong>
      <span id="health"></span>
    </div>
    <button id="newWorkspace" class="sm">+ 新規ワークスペース</button>
  </header>

  <main>
    <aside>
      <h3>ワークスペース</h3>
      <div id="workspaces"></div>
    </aside>

    <section id="app">
      <div class="empty">ワークスペースを作成または選択してください。</div>
    </section>
  </main>

  <dialog id="tokenDialog">
    <form method="dialog">
      <h3>認証が必要です</h3>
      <p>MULTICONTEXT_APP_TOKEN の設定が必要です。</p>
      <input id="tokenInput" type="password" placeholder="Bearer トークン" autocomplete="current-password">
      <menu>
        <button value="cancel">キャンセル</button>
        <button id="saveToken" value="default" class="primary">保存</button>
      </menu>
    </form>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
