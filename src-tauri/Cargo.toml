[package]
name = "multicontext-desktop"
version = "0.2.0"
edition = "2021"
rust-version = "1.77"
description = "MultiContext Desktop launcher"
authors = ["Unjuno"]
license = "MIT"
repository = "https://github.com/Unjuno/multicontext-chat"
default-run = "multicontext-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
libc = "0.2"
