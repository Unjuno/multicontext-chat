name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build:server
      - run: node --check dist/server.bundle.mjs
      - run: npm run check
      - name: verify production bundle is self-contained (no bare MCP import)
        run: |
          test -f dist/server.bundle.mjs
          ! grep -q "from '@modelcontextprotocol/server'" dist/server.bundle.mjs || (echo "bundle still has bare MCP import" && exit 1)
          ! grep -q "from 'zod'" dist/server.bundle.mjs || (echo "bundle still has bare zod import" && exit 1)
          echo "bundle verification passed"
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build:server
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
